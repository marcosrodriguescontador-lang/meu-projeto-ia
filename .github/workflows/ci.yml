name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Electron + Playwright)
        run: xvfb-run -a node tests/e2e/fase1.e2e.cjs && xvfb-run -a node tests/e2e/fase2.e2e.cjs && xvfb-run -a node tests/e2e/fase3.e2e.cjs
        env:
          E2E_CAPTURAS: ${{ runner.temp }}/capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: ${{ runner.temp }}/capturas

  instalador-windows:
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: release/*.exe
